name: Build iOS Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Theos Framework
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV

    - name: Setup iOS SDK
      run: |
        mkdir -p ~/theos/sdks
        curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
        unzip -q master.zip
        cp -R sdks-master/* ~/theos/sdks/
        rm -rf master.zip sdks-master

    - name: Auto Extract and Flatten Zip
      run: |
        python3 -c "
        import zipfile, os, shutil

        with zipfile.ZipFile('Drawdylib.zip', 'r') as zip_ref:
            zip_ref.extractall('extracted_temp')

        target_dir = 'extracted_temp'
        for root, dirs, files in os.walk('extracted_temp'):
            for f in files:
                if f.lower() == 'makefile':
                    target_dir = root
                    break

        for item in os.listdir(target_dir):
            s = os.path.join(target_dir, item)
            d = os.path.join('.', item)
            if os.path.exists(d):
                if os.path.isdir(d):
                    shutil.rmtree(d)
                else:
                    os.remove(d)
            shutil.move(s, d)

        shutil.rmtree('extracted_temp', ignore_errors=True)
        "

    - name: Auto Detect All Header Folders & Compile
      run: |
        export THEOS=~/theos
        
        # Project ke har folder/subfolder ka path automatically dhoond kar -I flag banayega
        INCLUDE_FLAGS=$(find . -type d ! -path '*/.*' -exec echo -n "-I{} " \;)
        echo "Generated Include Flags: $INCLUDE_FLAGS"
        
        # Theos ko dynamically saare header paths aur C++ standard pass karein
        make package FINALPACKAGE=1 \
          ADDITIONAL_CFLAGS="-fobjc-arc -w $INCLUDE_FLAGS" \
          ADDITIONAL_CCFLAGS="-std=c++17 -stdlib=libc++ -Wno-c++11-extensions -Wno-everything $INCLUDE_FLAGS"

    - name: Upload Compiled Artifact (.deb / .dylib)
      uses: actions/upload-artifact@v4
      with:
        name: OsirisDrawESP-Build
        path: |
          packages/*.deb
          **/*.deb
