name: Build iOS Dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Theos & Tools
      run: |
        brew install ldid
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV

    - name: Setup iOS SDK
      run: |
        mkdir -p ~/theos/sdks
        curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
        unzip -q master.zip
        cp -R sdks-master/* ~/theos/sdks/
        rm -rf master.zip sdks-master

    - name: Extract, Flatten and Sanitize Names
      run: |
        python3 -c "
        import zipfile, os, shutil

        if os.path.exists('Drawdylib.zip'):
            with zipfile.ZipFile('Drawdylib.zip', 'r') as zip_ref:
                zip_ref.extractall('extracted_temp')

            target_dir = 'extracted_temp'
            for root, dirs, files in os.walk('extracted_temp'):
                for f in files:
                    if f.lower() == 'makefile':
                        target_dir = root
                        break

            for item in os.listdir(target_dir):
                s = os.path.join(target_dir, item)
                d = os.path.join('.', item)
                if os.path.exists(d):
                    if os.path.isdir(d):
                        shutil.rmtree(d)
                    else:
                        os.remove(d)
                shutil.move(s, d)

            shutil.rmtree('extracted_temp', ignore_errors=True)

        for root, dirs, files in os.walk('.', topdown=False):
            for name in dirs:
                if ' ' in name:
                    old_path = os.path.join(root, name)
                    new_path = os.path.join(root, name.replace(' ', '_'))
                    if not os.path.exists(new_path):
                        os.rename(old_path, new_path)
        "

    - name: Clean Duplicates & Fix Code
      run: |
        python3 -c "
        import os

        seen_files = set()
        for root, dirs, files in os.walk('.'):
            if any(p in root for p in ['.git', '.theos', 'packages', 'sdks-master']):
                continue
            for f in files:
                if f.endswith(('.m', '.mm', '.cpp')):
                    lower_name = f.lower()
                    full_path = os.path.join(root, f)
                    if lower_name in seen_files:
                        print(f'Removing duplicate: {full_path}')
                        os.remove(full_path)
                    else:
                        seen_files.add(lower_name)

        if os.path.exists('autofire.mm'):
            with open('autofire.mm', 'w') as af:
                af.write('#import <Foundation/Foundation.h>\nvoid autoFireStub() {}\n')
        "

        # Fix typedef conflict between Offset.h and JFCommon.h
        find . -type f -name "Offset.h" -exec sed -i '' 's/typedef uintptr_t kaddr;/typedef long kaddr;/g' {} +

        # Fix C++17 typeof syntax
        find . -type f \( -name "*.m" -o -name "*.mm" -o -name "*.h" \) -exec sed -i '' 's/typeof(self)/__typeof__(self)/g' {} +
        find . -type f \( -name "*.m" -o -name "*.mm" -o -name "*.h" \) -exec sed -i '' 's/__weak typeof/__weak __typeof__/g' {} +

        # Fix AddConvexPolyFilled argument mismatch (3 -> 5 arguments)
        find . -type f \( -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/AddConvexPolyFilled(vec, 3 , \[self getImU32/AddConvexPolyFilled(vec, 3, vec, 3, \[self getImU32/g' {} +
        find . -type f \( -name "*.m" -o -name "*.mm" \) -exec sed -i '' 's/AddConvexPolyFilled(vec, 3, \[self getImU32/AddConvexPolyFilled(vec, 3, vec, 3, \[self getImU32/g' {} +

        # Fix GuiRenderer hasActionTouch typo
        find . -type f -name "GuiRenderer.mm" -exec sed -i '' 's/hasActionTouch = YES;/hasActiveTouch = YES;/g' {} +

        # Clean duplicate getUEString/GetFName functions in Drawzb.mm if any
        python3 -c "
        import os
        for root, dirs, files in os.walk('.'):
            for f in files:
                if f == 'Drawzb.mm':
                    path = os.path.join(root, f)
                    with open(path, 'r', encoding='utf-8', errors='ignore') as file:
                        content = file.read()
                    
                    # Keep only first occurrence of getUEString
                    if content.count('string getUEString(kaddr address)') > 1:
                        parts = content.split('string getUEString(kaddr address)')
                        content = parts[0] + 'string getUEString(kaddr address)' + parts[1]
                    
                    with open(path, 'w', encoding='utf-8') as file:
                        file.write(content)
        "

    - name: Compile Dylib Only
      run: |
        export THEOS=~/theos
        
        INC_DIRS=$(find . -maxdepth 4 -type d ! -path '*/.*' ! -path './theos*' ! -path './packages*' | sed 's/^/-I/' | tr '\n' ' ')
        
        SOURCES=$(find . -type f \( -name "*.m" -o -name "*.mm" -o -name "*.cpp" \) \
          ! -path '*/.*' \
          ! -path './theos*' \
          ! -path './packages*' \
          ! -path './AEScrypt*' \
          ! -path './AEScript*' \
          ! -path './Host*' \
          ! -path './Hosts*' | tr '\n' ' ')
        echo "Final Sources to Compile: $SOURCES"

        make FINALPACKAGE=1 \
          OsirisDrawESP_FILES="$SOURCES" \
          ADDITIONAL_CFLAGS="-fobjc-arc -w -Wno-everything $INC_DIRS" \
          ADDITIONAL_CCFLAGS="-std=c++17 -stdlib=libc++ -Wno-c++11-extensions -Wno-everything $INC_DIRS"

        mkdir -p ./output
        find .theos -type f -name "*.dylib" -exec cp {} ./output/ \;

    - name: Upload Compiled Dylib
      uses: actions/upload-artifact@v4
      with:
        name: OsirisDrawESP-Dylib
        path: ./output/*.dylib
