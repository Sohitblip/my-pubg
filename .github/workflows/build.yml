name: Build iOS Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Theos Framework
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV

    - name: Setup iOS SDK
      run: |
        mkdir -p ~/theos/sdks
        curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
        unzip -q master.zip
        cp -R sdks-master/* ~/theos/sdks/
        rm -rf master.zip sdks-master

    - name: Auto Extract and Flatten Zip
      run: |
        python3 -c "
        import zipfile, os, shutil

        # 1. Extract zip to temp folder
        with zipfile.ZipFile('Drawdylib.zip', 'r') as zip_ref:
            zip_ref.extractall('extracted_temp')

        # 2. Locate folder containing Makefile
        target_dir = 'extracted_temp'
        for root, dirs, files in os.walk('extracted_temp'):
            for f in files:
                if f.lower() == 'makefile':
                    target_dir = root
                    break

        # 3. Move everything to workspace root
        for item in os.listdir(target_dir):
            s = os.path.join(target_dir, item)
            d = os.path.join('.', item)
            if os.path.exists(d):
                if os.path.isdir(d):
                    shutil.rmtree(d)
                else:
                    os.remove(d)
            shutil.move(s, d)

        shutil.rmtree('extracted_temp', ignore_errors=True)
        "

    - name: Normalize Source Filenames
      run: |
        # Ensure exact filename matching for case-sensitive compilers
        for file in *; do
          lower=$(echo "$file" | tr '[:upper:]' '[:lower:]')
          if [ "$lower" = "drawim.mm" ]; then
            cp -f "$file" DrawIm.mm
            cp -f "$file" Drawim.mm
          elif [ "$lower" = "drawim.h" ]; then
            cp -f "$file" DrawIm.h
            cp -f "$file" Drawim.h
          fi
        done
        echo "=== Files Ready for Compilation ==="
        ls -la

    - name: Compile Tweak Package
      run: |
        export THEOS=~/theos
        make package FINALPACKAGE=1

    - name: Upload Compiled Artifact (.deb / .dylib)
      uses: actions/upload-artifact@v4
      with:
        name: OsirisDrawESP-Build
        path: |
          packages/*.deb
          **/*.deb
