name: Build iOS Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Theos Framework
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV
        
    - name: Setup iOS SDK
      run: |
        mkdir -p ~/theos/sdks
        curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
        unzip -q master.zip
        cp -R sdks-master/* ~/theos/sdks/
        rm -rf master.zip sdks-master

    - name: Extract and Flatten All Project Files
      run: |
        python3 -c "
        import zipfile, os, shutil
        
        with zipfile.ZipFile('Drawdylib.zip', 'r') as zip_ref:
            zip_ref.extractall('temp_extract')
        
        # Makefile ka actual folder locate karo
        src_dir = 'temp_extract'
        for root, dirs, files in os.walk('temp_extract'):
            if 'Makefile' in files:
                src_dir = root
                break
                
        # Saari files/folders ko root level par transfer karo
        for item in os.listdir(src_dir):
            s = os.path.join(src_dir, item)
            d = os.path.join('.', item)
            if os.path.exists(d) and os.path.abspath(s) != os.path.abspath(d):
                if os.path.isdir(d):
                    shutil.rmtree(d)
                else:
                    os.remove(d)
            if os.path.abspath(s) != os.path.abspath(d):
                shutil.move(s, d)
            
        shutil.rmtree('temp_extract', ignore_errors=True)
        "

    - name: Verify and Align File Names
      run: |
        echo "=== Root Directory Listing ==="
        ls -la
        # Filename case differences handle karne ke liye safety sync
        for ext in mm h cpp; do
          for f in $(find . -maxdepth 1 -name "*.$ext" -o -name "*.${ext^^}"); do
            base=$(basename "$f")
            lower=$(echo "$base" | tr '[:upper:]' '[:lower:]')
            if [ "$lower" = "drawim.mm" ]; then
              cp -f "$f" ./DrawIm.mm
              cp -f "$f" ./Drawim.mm
            fi
            if [ "$lower" = "drawim.h" ]; then
              cp -f "$f" ./DrawIm.h
              cp -f "$f" ./Drawim.h
            fi
          done
        done

    - name: Compile Tweak Package
      run: |
        export THEOS=~/theos
        make package FINALPACKAGE=1

    - name: Upload Compiled Artifact (.deb / .dylib)
      uses: actions/upload-artifact@v4
      with:
        name: OsirisDrawESP-Build
        path: |
          packages/*.deb
          **/*.deb
