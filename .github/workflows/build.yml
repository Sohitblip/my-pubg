name: Build iOS Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Theos Framework
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV
        
    - name: Setup iOS SDK
      run: |
        mkdir -p ~/theos/sdks
        curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
        unzip -q master.zip
        cp -R sdks-master/* ~/theos/sdks/
        rm -rf master.zip sdks-master

    - name: Unzip Project Files
      run: |
        python3 -c "import zipfile; zipfile.ZipFile('Drawdylib.zip').extractall('./project_extracted')"
        if [ -d "./project_extracted/Drawdylib" ]; then
          cp -R ./project_extracted/Drawdylib/* .
        else
          cp -R ./project_extracted/* .
        fi
        rm -rf ./project_extracted

    - name: Compile Tweak Package
      run: |
        export THEOS=~/theos
        make package FINALPACKAGE=1

    - name: Upload Compiled Artifact (.deb / .dylib)
      uses: actions/upload-artifact@v4
      with:
        name: OsirisDrawESP-Build
        path: packages/*.deb
